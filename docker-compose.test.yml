# 仅供开发期做 S3 语义交叉验证，**不属于交付物**。
# 用法：docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# 之所以单独拆出来：Zenko 用的是公开已知的默认密钥（accessKey1/verySecretKey1），
# 留在主 compose 里会随交付一起装到客户机上并长期运行。
services:
  # 严格 S3 语义交叉验证：Zenko CloudServer（模拟群晖/威联通独立 S3 服务端）
  zenko:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: accessKey1
      SCALITY_SECRET_ACCESS_KEY: verySecretKey1
      ENDPOINT: zenko
      REMOTE_MANAGEMENT_DISABLE: 1
    ports:
      # 仅绑定本机回环：测试用 S3 服务使用公开已知的默认密钥，绝不可对外暴露
      - "127.0.0.1:8001:8000"   # 主机映射 8001 避免与后端冲突
    restart: unless-stopped
