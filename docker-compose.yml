# 配置全部来自 .env（见 .env.example）。首次部署请运行 scripts/install.sh，
# 它会生成随机口令、写好 .env 再起服务——不要手工照抄任何示例口令。
#
# 镜像一律固定到具体版本：用 :latest / :alpine 时重新 pull 可能拿到与测试过的
# 不同的东西（本项目历史上 nginx 因此出过两次问题）。升级请显式改这里的版本号。
services:
  mysql:
    image: mysql:8.0.46
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # :? 表示未设置就直接报错退出——宁可起不来，也不要静默地用上一个弱默认口令
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请先运行 scripts/install.sh 生成 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coo}
      MYSQL_USER: ${MYSQL_USER:-coo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?未设置，请先运行 scripts/install.sh 生成 .env}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：数据库不对外网/局域网暴露（容器间走 compose 内部网络）。
      # 宿主侧映射 3307，避免与本机已有的 3306 服务冲突（backend 走容器网络不受影响）
      - "127.0.0.1:3307:3306"
    healthcheck:
      # $$ 转义为容器内的 $：口令从容器环境读取，不会出现在 `docker compose config` 的输出里
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?未设置，请先运行 scripts/install.sh 生成 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?未设置，请先运行 scripts/install.sh 生成 .env}
      # 控制台经反向代理对外时必须告诉它浏览器侧的地址，否则登录跳转会指回
      # 容器内部的 localhost:9001，浏览器直接断在这一跳。留空即不对外暴露。
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
    volumes:
      - minio_data:/data
    ports:
      # 仅绑定本机回环：外部流量一律经 Cloudflare Tunnel（控制台 coo-nas.chongzhu.ai
      # → localhost:9001），源站不在局域网/公网直接暴露；S3 API 始终不对外
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 管理控制台
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-coo}:${MYSQL_PASSWORD:?未设置}@mysql:3306/${MYSQL_DATABASE:-coo}?charset=utf8mb4
      # JWT 密钥不再走环境变量：首次启动自动生成并存库，超管可在「组织管理 → 安全设置」轮换
      # 生产模式：不创建演示账号；首次启动仅建 admin，随机密码打印在启动日志（仅一次）。
      # 演示/验收环境在 .env 里设 SEED_DEMO_DATA=true 才会建全套演示账号与示例订单——
      # 默认仍是 false，正式交付时把 .env 里那行删掉即可回到生产语义。
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # 站点时区：NAS 定时同步与超期判断按此计算
      TIMEZONE: ${TIMEZONE:-Asia/Bangkok}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      NAS_ROOT: /app/data/nas
      UPLOAD_DIR: /app/data/uploads
      # NAS 归档走 S3 兼容接口（MinIO 本地模拟）。
      # 访问密钥直接引用 MinIO 的根凭据，避免两处各写一份、改一处漏一处
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?未设置}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?未设置}
      S3_BUCKET: ${S3_BUCKET:-coo-nas}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      # NAS 挂载点：本地目录回退模式使用；S3 模式不再依赖挂载
      - ./nas_mount:/app/data/nas
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    # 健康检查探测 /health（该端点会真正查一次数据库），让编排与监控能感知
    # "进程还活着但依赖已挂"的状态；start_period 覆盖建表与种子数据的启动耗时
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      # 仅绑定本机回环：外部流量必须经 nginx（frontend:80）代理，防止绕过认证头与体积限制；
      # 本机保留 8000 供 vite dev 代理与本地调试使用
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：对外访问一律经 Cloudflare Tunnel（coo.chongzhu.ai → localhost:80），
      # HTTPS 由 Cloudflare 边缘终结；源站不在局域网/公网暴露
      - "127.0.0.1:80:80"

volumes:
  mysql_data:
  minio_data:
