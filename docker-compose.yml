services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: coo
      MYSQL_USER: coo
      MYSQL_PASSWORD: coo123456
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：数据库不对外网/局域网暴露（容器间走 compose 内部网络）。
      # 宿主侧映射 3307，避免与本机已有的 3306 服务冲突（backend 走容器网络不受影响）
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coominio
      MINIO_ROOT_PASSWORD: coominio123
    volumes:
      - minio_data:/data
    ports:
      # 仅绑定本机回环：对象存储与控制台不对外暴露（backend 走容器网络访问）
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 管理控制台
    restart: unless-stopped

  # 严格 S3 语义交叉验证：Zenko CloudServer（模拟群晖/威联通独立 S3 服务端）
  # 默认密钥 accessKey1/verySecretKey1，端口 8000；boto3 直接对接即可
  zenko:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: accessKey1
      SCALITY_SECRET_ACCESS_KEY: verySecretKey1
      ENDPOINT: zenko
      REMOTE_MANAGEMENT_DISABLE: 1
    ports:
      # 仅绑定本机回环：测试用 S3 服务使用公开已知的默认密钥，绝不可对外暴露
      - "127.0.0.1:8001:8000"   # 主机映射 8001 避免与后端冲突
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://coo:coo123456@mysql:3306/coo?charset=utf8mb4
      # JWT 密钥不再走环境变量：首次启动自动生成并存库，超管可在「组织管理 → 安全设置」轮换
      # 生产模式：不创建演示账号；首次启动仅建 admin，随机密码打印在启动日志（仅一次）
      SEED_DEMO_DATA: "false"
      # 站点时区：NAS 定时同步与超期判断按此计算
      TIMEZONE: Asia/Bangkok
      CORS_ORIGINS: http://localhost,http://localhost:5173
      NAS_ROOT: /app/data/nas
      UPLOAD_DIR: /app/data/uploads
      # NAS 归档走 S3 兼容接口（MinIO 本地模拟）
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: coominio
      S3_SECRET_KEY: coominio123
      S3_BUCKET: coo-nas
      S3_REGION: us-east-1
    volumes:
      # NAS 挂载点：本地目录回退模式使用；S3 模式不再依赖挂载
      - ./nas_mount:/app/data/nas
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    # 健康检查探测 /health（该端点会真正查一次数据库），让编排与监控能感知
    # "进程还活着但依赖已挂"的状态；start_period 覆盖建表与种子数据的启动耗时
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      # 仅绑定本机回环：外部流量必须经 nginx（frontend:80）代理，防止绕过认证头与体积限制；
      # 本机保留 8000 供 vite dev 代理与本地调试使用
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：对外访问一律经 Cloudflare Tunnel（coo.chongzhu.ai → localhost:80），
      # HTTPS 由 Cloudflare 边缘终结；源站不在局域网/公网暴露
      - "127.0.0.1:80:80"

volumes:
  mysql_data:
  minio_data:
