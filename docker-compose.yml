services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: coo
      MYSQL_USER: coo
      MYSQL_PASSWORD: coo123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coominio
      MINIO_ROOT_PASSWORD: coominio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    restart: unless-stopped

  # 严格 S3 语义交叉验证：Zenko CloudServer（模拟群晖/威联通独立 S3 服务端）
  # 默认密钥 accessKey1/verySecretKey1，端口 8000；boto3 直接对接即可
  zenko:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: accessKey1
      SCALITY_SECRET_ACCESS_KEY: verySecretKey1
      ENDPOINT: zenko
      REMOTE_MANAGEMENT_DISABLE: 1
    ports:
      - "8001:8000"   # 主机映射 8001 避免与后端冲突
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://coo:coo123456@mysql:3306/coo?charset=utf8mb4
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost,http://localhost:5173
      NAS_ROOT: /app/data/nas
      UPLOAD_DIR: /app/data/uploads
      # NAS 归档走 S3 兼容接口（MinIO 本地模拟）
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: coominio
      S3_SECRET_KEY: coominio123
      S3_BUCKET: coo-nas
      S3_REGION: us-east-1
    volumes:
      # NAS 挂载点：本地目录回退模式使用；S3 模式不再依赖挂载
      - ./nas_mount:/app/data/nas
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"

volumes:
  mysql_data:
  minio_data:
