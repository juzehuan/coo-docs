# COO 资料收集平台 · Nginx 反向代理
# 对应落地方案「六、落地部署」与「八、风险控制与保障」。
# 生产启用 HTTPS：配置 ssl_certificate / ssl_certificate_key 并把 80 端口跳转到 https（见文末示例）。

# 隐藏 nginx 版本号，避免信息泄露
server_tokens off;

# .mjs（PDF.js worker）未在默认 mime.types 中。
# http 级 types 与 mime.types 同级，条目合并（server/location 级才会整体替换默认映射，导致 html 变成 octet-stream 被下载）
types {
    text/javascript mjs;
}

# Cloudflare Tunnel 场景：真实客户端 IP 在 CF-Connecting-IP 头（源站仅回环+隧道可达，头不可被外部伪造）；
# 本机直连/局域网场景回退 socket 对端地址
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# 经 Cloudflare 时原始协议为 https（边缘终结 TLS），透传给后端；直连回退当前 scheme
map $http_x_forwarded_proto $origin_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全响应头（server 级定义；各 location 未再使用 add_header 所以自动继承覆盖全站）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/csv text/javascript application/json application/javascript application/xml image/svg+xml;

    # 禁止访问隐藏/敏感文件（.well-known 例外，供证书续期）
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SPA 路由回退（expires 生成 Cache-Control，不占用 add_header 继承规则）
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 静态资源长缓存。文件名带内容哈希，内容一变文件名就变，因此可标记
    # immutable：浏览器连"重新验证"都不必做（否则每次强刷都要为每个分块
    # 往返一次，而 antd 分块有 374KB，重新验证虽只回 304 也仍有 RTT 成本）。
    location /assets/ {
        # 只用 add_header 指定，不再叠加 expires：两者会各发一个 Cache-Control，
        # 同一响应出现两个同名头，浏览器取哪个不确定
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # 该 location 使用了 add_header，server 级安全头不再继承，需在此重申
        add_header X-Content-Type-Options nosniff always;
    }

    # 动态解析 backend：使用 Docker 内置 DNS（127.0.0.11），backend 容器重建更换 IP 后
    # nginx 每 10s 自动重新解析，避免 502；同时避免容器启动时 backend 未就绪导致的启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 健康检查必须能从站点入口探到真实状态。
    # 此前 /health 没有单独的 location，被 SPA 回退接管：nginx 返回 index.html
    # 且状态码 200 —— 外部监控探测公网地址会**永远认为服务健康**，即便数据库
    # 已宕机、后端本身返回 503。健康检查的全部意义就是故障时能告警，
    # 而它当时只会永远说没事。
    location = /health {
        set $health_upstream http://backend:8000;
        proxy_pass $health_upstream/health;
        proxy_set_header Host $host;
        # 探活结果不得被任何中间层缓存，否则同样会掩盖故障
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # 代理 API 到后端
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 让后端感知原始协议（HTTPS 时应用应启用 HSTS / 生成安全链接）
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # 大文件上传
        client_max_body_size 200m;

        # ---- 超时：不设置就全部走 nginx 默认的 60 秒 ----
        # 实测（第 65 轮，用与生产同款配置的隔离 nginx + 一个耗时 75s 的上游）：
        # 请求在 **60.06 秒**返回 **504**，且是 nginx 的裸 HTML 页面——不经过应用的
        # 错误处理，前端 errMessage 拿不到任何可读信息，用户只看到一个网关错误。
        #
        # 本系统确实存在会超过 60 秒的合法操作：`POST /api/nas/sync` 是**同步**的，
        # 实测同机 MinIO 上全量同步 130 个附件耗时 5.04s（约 39ms/件）；按第 3 轮压测
        # 的两年规模 12007 个附件线性外推约 **468 秒**，而真实 NAS 在工厂内网、
        # 走加密隧道，每件成本只会更高。审计导出（上限 10 万行）同样会逼近 60 秒。
        # 更糟的是超时后后端仍在继续跑，用户重试会撞上同步互斥返回 409，
        # 看起来像是第二次失败。
        #
        # connect 保持短：连同一个 compose 网络里的后端应当是瞬时的，连不上要快速失败，
        # 不该让用户等 60 秒。read/send 放宽到 10 分钟，覆盖上述长操作，
        # 同时仍为"后端真的挂住"保留上界。
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 工厂网络不稳时，上传中途停顿 60 秒就会让一个已传了几分钟的大文件前功尽弃
        client_body_timeout 300s;
    }
}

